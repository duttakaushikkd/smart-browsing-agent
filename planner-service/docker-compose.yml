services:
  planner-service:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379/0
      BROWSER_SERVICE_URL: http://host.docker.internal:8080

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
